<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semplice Pong JS</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #000;
        }
        #ui {
            position: absolute;
            top: 20px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>PONG</h1>
        <p>Usa le frecce su/giù o W/S per muoverti</p>
    </div>
    <canvas id="pongCanvas"></canvas>

    <script>
        const canvas = document.getElementById("pongCanvas");
        const ctx = canvas.getContext("2d");

        // Configurazione dimensioni
        canvas.width = 800;
        canvas.height = 400;

        // Proprietà della racchetta
        const paddleWidth = 10, paddleHeight = 80;
        let leftPaddleY = (canvas.height - paddleHeight) / 2;
        let rightPaddleY = (canvas.height - paddleHeight) / 2;
        const paddleSpeed = 8;

        // Proprietà della pallina
        let ballX = canvas.width / 2;
        let ballY = canvas.height / 2;
        let ballSize = 8;
        let ballSpeedX = 5;
        let ballSpeedY = 5;

        // Punteggio
        let leftScore = 0;
        let rightScore = 0;

        // Input tastiera
        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.key] = true);
        window.addEventListener("keyup", (e) => keys[e.key] = false);

        function update() {
            // Movimento racchetta sinistra (Giocatore)
            if ((keys["w"] || keys["W"]) && leftPaddleY > 0) leftPaddleY -= paddleSpeed;
            if ((keys["s"] || keys["S"]) && leftPaddleY < canvas.height - paddleHeight) leftPaddleY += paddleSpeed;

            // Movimento racchetta destra (IA semplice)
            let centerPaddle = rightPaddleY + paddleHeight / 2;
            if (centerPaddle < ballY - 10) rightPaddleY += paddleSpeed * 0.7;
            else if (centerPaddle > ballY + 10) rightPaddleY -= paddleSpeed * 0.7;

            // Movimento pallina
            ballX += ballSpeedX;
            ballY += ballSpeedY;

            // Rimbalzo bordi sopra e sotto
            if (ballY <= 0 || ballY >= canvas.height) ballSpeedY = -ballSpeedY;

            // Collisione racchetta sinistra
            if (ballX <= paddleWidth) {
                if (ballY > leftPaddleY && ballY < leftPaddleY + paddleHeight) {
                    ballSpeedX = -ballSpeedX;
                    ballSpeedX *= 1.05; // Aumenta velocità a ogni colpo
                } else {
                    rightScore++;
                    resetBall();
                }
            }

            // Collisione racchetta destra
            if (ballX >= canvas.width - paddleWidth) {
                if (ballY > rightPaddleY && ballY < rightPaddleY + paddleHeight) {
                    ballSpeedX = -ballSpeedX;
                    ballSpeedX *= 1.05;
                } else {
                    leftScore++;
                    resetBall();
                }
            }
        }

        function resetBall() {
            ballX = canvas.width / 2;
            ballY = canvas.height / 2;
            ballSpeedX = -ballSpeedX > 0 ? 5 : -5;
            ballSpeedY = 5;
        }

        function draw() {
            // Sfondo
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linea centrale
            ctx.setLineDash([10, 10]);
            ctx.strokeStyle = "rgba(255,255,255,0.2)";
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Racchette
            ctx.fillStyle = "white";
            ctx.fillRect(0, leftPaddleY, paddleWidth, paddleHeight);
            ctx.fillRect(canvas.width - paddleWidth, rightPaddleY, paddleWidth, paddleHeight);

            // Pallina
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballSize, 0, Math.PI * 2);
            ctx.fill();

            // Testo punteggio
            ctx.font = "32px Arial";
            ctx.fillText(leftScore, canvas.width / 4, 50);
            ctx.fillText(rightScore, 3 * canvas.width / 4, 50);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
